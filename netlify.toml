[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Oude adressen zonder .html blijven werken
[[redirects]]
  from = "/biografie"
  to = "/biografie.html"
  status = 301

[[redirects]]
  from = "/projecten"
  to = "/projecten.html"
  status = 301

[[redirects]]
  from = "/agenda"
  to = "/agenda.html"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
