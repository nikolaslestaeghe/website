# Instellingen voor de beheerpagina (Pages CMS, https://app.pagescms.org)
# Hier staat welke formulieren je ziet en waar alles wordt bewaard.

media:
  - name: images
    label: Foto's
    input: static/images
    output: /images
    categories: [image]
  - name: videos
    label: Video's
    input: static/videos
    output: /videos
    extensions: [mp4, webm]
  - name: bestanden
    label: Speellijsten
    input: static/bestanden
    output: /bestanden
    extensions: [xlsx, csv]

content:
  # ---------- Projecten ----------
  - name: projecten
    label: Projecten
    type: collection
    path: content/projecten
    format: json
    filename: "{primary}.json"
    view:
      primary: titel
      fields: [titel, jaar, zichtbaar]
      sort: jaar
      order: desc
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: kop
        label: Titel op de foto (optioneel)
        type: text
        description: "Leeg = gewone titel. Een Enter maakt een nieuwe regel, bv. Loopgraven- / operette."
      - name: jaar
        label: Jaar
        type: string
        description: "Bv. 2024 of 2023 – 2025. Het laatste jaartal bepaalt de volgorde op de site."
      - name: zichtbaar
        label: Zichtbaar op de site
        type: boolean
        default: true
        description: "Zet uit om een project voorlopig te verbergen."
      - name: soort
        label: Soort project
        type: select
        description: "Eigen werk = het idee vertrekt (mee) vanuit jou, ook samen met anderen of met K.A.K. Samenwerking = een project van een ander gezelschap of een andere maker waar jij aan meewerkt. Leeg = eigen werk."
        options:
          values:
            - name: eigen
              label: Eigen werk
            - name: samenwerking
              label: Samenwerking
      - name: met
        label: Met wie / mijn rol (optioneel)
        type: string
        description: "Verschijnt op de tegel als je erover gaat. Bv. 'met K.A.K.' of 'spel & decor · Theater Malpertuis'."
      - name: cover
        label: Grote foto bovenaan
        type: image
        options:
          media: images
      - name: achterfoto
        label: Foto achter 'In beeld'
        type: image
        options:
          media: images
      - name: tegelfoto
        label: Foto op de projectenpagina
        type: image
        description: "Leeg = de grote foto bovenaan."
        options:
          media: images
      - name: intro
        label: Inleiding (groot gedrukt)
        type: text
      - name: tekst
        label: Tekst
        type: rich-text
        options:
          format: html
          media: images
      - name: citaat
        label: Citaat of recensie (optioneel)
        type: text
      - name: credits
        label: Credits
        type: text
        description: "Eén rol per regel, bv. 'Spel: ...'"
      - name: video
        label: Videolink (YouTube of Vimeo, optioneel)
        type: string
      - name: video_bestand
        label: Of een videobestand van je computer (optioneel)
        description: "Enkel .mp4, maximaal 25 MB (± 1 à 2 minuten in goede kwaliteit). Voor langere video's gebruik je beter YouTube of Vimeo."
        type: file
        options:
          media: videos
      - name: video_poster
        label: Startbeeld van de video (optioneel)
        description: "De foto die getoond wordt voor de video start. Leeg = het eerste beeld van de video."
        type: image
        options:
          media: images
      - name: speellijst
        label: Speellijst
        description: "Voeg per voorstelling een datum toe. Voorbije data blijven zichtbaar onder 'Eerder gespeeld' en in het agenda-archief."
        type: object
        list: true
        fields:
          - name: datum
            label: Datum
            type: date
            required: true
          - name: uur
            label: Uur (optioneel)
            type: string
          - name: locatie
            label: Plaats
            type: string
            description: "Bv. CC Belgica, Dendermonde"
          - name: link
            label: Link voor tickets (optioneel)
            type: string
          - name: opmerking
            label: Opmerking (optioneel)
            type: string
            description: "Bv. uitverkocht, schoolvoorstelling, première"
      - name: speellijst_bestand
        label: Speellijst als Excel- of CSV-bestand (optioneel)
        description: "Kolommen: datum, uur, locatie, stad, link, opmerking. Kolomnamen mogen in eender welke volgorde staan."
        type: file
        options:
          media: bestanden
      - name: fotos
        label: Foto's
        type: image
        options:
          media: images
          multiple:
            max: 40
      - name: fotocredits
        label: Fotocredits
        type: string
      - name: media
        label: Links (rechterkolom)
        type: object
        list: true
        fields:
          - name: titel
            label: Tekst van de link
            type: string
          - name: titel_en
            label: Tekst van de link in het Engels (optioneel)
            type: string
          - name: link
            label: Adres (https://...)
            type: string
          - name: afbeelding
            label: Logo in plaats van tekst (optioneel)
            type: image
            options:
              media: images
      - name: en
        label: English version (Engelse versie)
        description: "Laat een veld leeg om op de Engelse site de Nederlandse tekst te tonen."
        type: object
        fields:
          - name: titel
            label: Title
            type: string
            description: "Leeg = dezelfde titel als in het Nederlands."
          - name: kop
            label: Title on the photo (optioneel)
            type: text
          - name: intro
            label: Introduction (blauw gedrukt)
            type: text
          - name: tekst
            label: Text
            type: rich-text
            options:
              format: html
          - name: citaat
            label: Quote or review
            type: text
          - name: credits
            label: Credits
            type: text
          - name: fotocredits
            label: Photo credits
            type: string
          - name: met
            label: With whom / my role
            type: string
            description: "Bv. 'with K.A.K.' of 'performance & set · Theater Malpertuis'."
      - name: volgorde
        label: Volgorde binnen hetzelfde jaar (optioneel)
        type: number
        description: "Hoger getal = eerder in de lijst. Meestal mag je dit leeg laten."

  # ---------- Losse agendapunten (niet aan een project gebonden) ----------
  - name: agenda
    label: Losse agendapunten
    type: collection
    path: content/agenda
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: titel
      fields: [datum, titel, locatie]
      sort: datum
      order: desc
    fields:
      - name: datum
        label: Datum
        type: date
        required: true
      - name: titel
        label: Titel
        type: string
        required: true
      - name: titel_en
        label: Titel in het Engels (optioneel)
        type: string
      - name: uur
        label: Uur (optioneel)
        type: string
      - name: locatie
        label: Plaats
        type: string
        description: "Bv. CC Belgica, Dendermonde"
      - name: link
        label: Link voor info of tickets (optioneel)
        type: string
      - name: project
        label: Bijhorend project (optioneel)
        type: reference
        options:
          collection: projecten
          search: titel
          value: "{path}"
          label: "{titel}"
        description: "Koppelt de voorstelling aan een projectpagina."

  # ---------- Losse pagina's ----------
  - name: biografie
    label: Biografie
    type: file
    path: content/biografie.json
    format: json
    fields:
      - name: kop
        label: Titel op de foto
        type: text
      - name: portret
        label: Foto bovenaan
        type: image
        options:
          media: images
      - name: intro
        label: Inleiding (groot gedrukt)
        type: text
      - name: tekst
        label: Tekst
        type: rich-text
        options:
          format: html
      - name: en
        label: English version (Engelse versie)
        description: "Laat een veld leeg om op de Engelse site de Nederlandse tekst te tonen."
        type: object
        fields:
          - name: kop
            label: Title on the photo
            type: text
          - name: intro
            label: Introduction (blauw gedrukt)
            type: text
          - name: tekst
            label: Text
            type: rich-text
            options:
              format: html
      - name: media
        label: Links (rechterkolom)
        type: object
        list: true
        fields:
          - name: titel
            label: Tekst van de link
            type: string
          - name: titel_en
            label: Tekst van de link in het Engels (optioneel)
            type: string
          - name: link
            label: Adres
            type: string

  - name: site
    label: Algemene gegevens
    type: file
    path: content/site.json
    format: json
    fields:
      - name: naam
        label: Naam
        type: string
      - name: omschrijving
        label: Korte omschrijving (voorpagina)
        type: text
      - name: email
        label: E-mail
        type: string
      - name: telefoon
        label: Telefoon
        type: string
      - name: links
        label: Extra links onderaan (bv. Instagram)
        type: object
        list: true
        fields:
          - name: titel
            type: string
          - name: link
            type: string
      - name: nieuwsbrief
        label: Inschrijfformulier nieuwsbrief tonen
        type: boolean
      - name: nieuwsbrief_url
        label: Brevo-formulierlink
        type: string
        description: "De link van je inschrijfformulier in Brevo (begint met https:// en bevat sibforms.com)."
      - name: achtergrond_home
        label: Foto op de voorpagina
        type: image
        options:
          media: images
      - name: ontwerp
        label: Vermelding webontwerp
        type: string
      - name: ontwerp_link
        label: Link webontwerper
        type: string
